name: Build Family APK

on:
  push:
    branches: [main, master]
    paths: ['family/**', '.github/workflows/build-family.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install dependencies and add Android
        working-directory: family
        run: |
          npm install
          npx cap add android
      - name: Native code
        working-directory: family
        run: |
          D=android/app/src/main/java/pk/smaa/cleanova/family
          mkdir -p $D
          cp java/pk/smaa/cleanova/family/*.java $D/
          ls $D
      - name: Signing key and version
        working-directory: family
        run: |
          cp ../smaa.keystore ~/.android/debug.keystore 2>/dev/null || (mkdir -p ~/.android && cp ../smaa.keystore ~/.android/debug.keystore)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/smaa.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
      - name: Manifest
        working-directory: family
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n</manifest>#' $M
          sed -i 's#</application>#    <service android:name=".FamilyService" android:exported="false" android:foregroundServiceType="location" />\n    <receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /></intent-filter></receiver>\n</application>#' $M
          cat $M
      - name: App icons
        working-directory: family
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp www/icon-192.png $RES/mipmap-$d/$n.png
            done
          done
      - name: Sync web files
        working-directory: family
        run: npx cap sync android
      - name: Build debug APK
        working-directory: family/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp family/android/app/build/outputs/apk/debug/app-debug.apk Cleanova-Family.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fam-${{ github.run_number }}
          name: Cleanova Family ${{ github.run_number }}
          files: Cleanova-Family.apk
