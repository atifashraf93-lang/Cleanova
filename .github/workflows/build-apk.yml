name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['family/**', '.github/workflows/build-family.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Native plugin and activity
        run: |
          D=android/app/src/main/java/pk/smaa/cleanova
          mkdir -p $D
          cp java/pk/smaa/cleanova/*.java $D/
          ls $D

      - name: Fixed signing key and version number
        run: |
          mkdir -p ~/.android
          cp smaa.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/smaa.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: ML Kit (face and background models, bundled)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          dependencies {
              implementation 'com.google.mlkit:face-detection:16.1.7'
              implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
          }
          android {
              defaultConfig {
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
          }
          GRADLE

      - name: Permissions (storage access)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' $M
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#</application>#    <service android:name=".MonitorService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="battery_monitor" /></service>\n    <service android:name=".TrackService" android:exported="false" android:foregroundServiceType="location" />\n    <service android:name=".ScanService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="storage_scan" /></service>\n    <service android:name=".ChatJob" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false" />\n    <service android:name=".ChatService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="chat_notifications" /></service>\n    <service android:name=".FamilyJob" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false" />\n    <receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /></intent-filter></receiver>\n</application>#' $M
          cat $M

      - name: App icons
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp www/icon-192.png $RES/mipmap-$d/$n.png
            done
          done

      - name: Stamp build number
        run: echo "window.CL_BUILD = ${{ github.run_number }};" > www/build.js

      - name: Smoke test (the app must start and every tab must open without errors)
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cd $GITHUB_WORKSPACE && NODE_PATH=/tmp/smoke/node_modules node tests/smoke.js

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK and pack the web files (self-update bundle)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Cleanova.apk
          cd android/app/src/main/assets/public && zip -qr "$GITHUB_WORKSPACE/www.zip" . && cd "$GITHUB_WORKSPACE" && ls -l www.zip

      - name: Second download address for the web bundle (ota branch)
        id: ota
        continue-on-error: true
        run: |
          mkdir -p /tmp/ota && cp www.zip /tmp/ota/ && cd /tmp/ota
          echo '{"n":${{ github.run_number }},"need":2}' > /tmp/ota/latest.json
          git init -q && git checkout -q -b ota
          git config user.name "Cleanova CI" && git config user.email "ci@users.noreply.github.com"
          git add www.zip latest.json && git commit -q -m "web bundle ${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin ota
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cleanova APK ${{ github.run_number }}
          body: "need=2 sha=${{ steps.ota.outputs.sha }}"
          files: |
            Cleanova.apk
            www.zip
