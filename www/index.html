<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Cleanova</title>
<style>
:root { --bg:#0b1220; --bg2:#101a2c; --card:#172640; --line:#263a55; --text:#EAF1F7; --mut:#9fb0c3; --acc:#5fd0b0; --accfg:#07251d; --red:#ef7b6c; --warn:#ffe08a; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Naskh Arabic','Noto Nastaliq Urdu',system-ui,sans-serif; font-size: 17px; line-height: 1.9; overflow: hidden; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; border: 0; background: none; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px 4px; flex: none; }
.top h1 { font-size: 24px; flex: 1; line-height: 1.7; }
.top small, .e { display: block; font-family: system-ui, sans-serif; font-size: 12px; color: var(--mut); line-height: 1.4; font-weight: 400; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 20px; }
#body { flex: 1; overflow-y: auto; padding: 8px 16px 24px; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 12px; }
.big { font-family: system-ui, sans-serif; font-size: 44px; font-weight: 700; color: var(--acc); direction: ltr; text-align: right; line-height: 1.3; }
.mut { color: var(--mut); font-size: 15px; }
.btn { display: block; width: 100%; min-height: 54px; border-radius: 16px; background: var(--acc); color: var(--accfg); font-size: 20px; font-weight: 700; text-align: center; margin-top: 14px; padding: 6px 12px; }
.btn small { color: var(--accfg); opacity: .75; }
.btn.o { background: none; border: 2px solid var(--line); color: var(--text); }
.btn.o small { color: var(--mut); }
.btn.red { background: var(--red); color: #2b0d09; }
.btn[disabled] { opacity: .4; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #223656; }
.row:last-child { border: 0; }
.pill { font-family: system-ui, sans-serif; font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 1px 10px; color: var(--mut); white-space: nowrap; direction: ltr; }
.bar { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--acc); transition: width .3s; }
.cat { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; text-align: right; padding: 12px 0; border-bottom: 1px solid #223656; min-height: 56px; }
.cat:last-child { border: 0; }
.cat b { font-weight: 600; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.sw { width: 52px; height: 30px; border-radius: 16px; background: var(--bg); border: 2px solid var(--line); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--mut); transition: .2s; }
.sw[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); }
.sw[aria-pressed="true"]::after { right: 25px; background: var(--accfg); }
.grp { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-top: 12px; }
.grp .hd { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--mut); line-height: 1.7; }
.thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; direction: ltr; padding-bottom: 4px; }
.th { flex: none; width: 104px; border-radius: 12px; border: 3px solid var(--line); background: var(--bg); position: relative; overflow: hidden; padding: 0; text-align: center; }
.th .im { width: 100%; height: 96px; background: var(--bg2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; font-size: 20px; color: var(--mut); text-transform: uppercase; }
.th .nm { font-family: system-ui, sans-serif; font-size: 10.5px; line-height: 1.4; padding: 3px 4px 0; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; }
.th .st { font-size: 13px; line-height: 1.7; padding-bottom: 2px; font-weight: 600; }
.th.keep { border-color: var(--acc); } .th.keep .st { color: var(--acc); }
.th.del { border-color: var(--red); } .th.del .st { color: var(--red); }
.th.del .im { opacity: .55; }
.bottom { flex: none; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.bottom .btn { margin-top: 0; }
.spin { width: 64px; height: 64px; border-radius: 50%; border: 6px solid var(--line); border-top-color: var(--acc); animation: sp 1s linear infinite; margin: 30px auto 10px; }
@keyframes sp { to { transform: rotate(360deg); } }
.center { text-align: center; }
#toast { position: absolute; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: #F4F7FA; color: #10231f; border-radius: 14px; padding: 8px 14px; text-align: center; z-index: 50; }
#toast[hidden], #modal[hidden] { display: none; }
#modal { position: absolute; inset: 0; z-index: 40; background: #000a; display: flex; align-items: flex-end; }
#modal .sheet { width: 100%; background: var(--bg2); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); padding: 18px 16px; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); }
.tabs { display: flex; gap: 8px; margin-top: 8px; }
.tabs button { flex: 1; min-height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
.tabs button[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
.foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--mut); }
</style>
</head>
<body>
<div id="app">
  <div class="top"><div style="flex:1"><h1 id="title">کلینووا <small>Cleanova</small></h1></div><span id="topact"></span></div>
  <div id="body"></div>
  <div class="bottom" id="bottom" hidden></div>
</div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden role="status"></div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
